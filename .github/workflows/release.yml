# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  push:
    tags: ['v*']

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Checks the CHANGELOG.md notes, then builds, tests, packs and runs the runner tests without any write permission
  # or publishing credentials.
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check release notes in CHANGELOG.md
        run: dotnet run --project build/Build.csproj -- --target Release-Notes
      - name: Install CycloneDX tool
        run: dotnet tool install -g CycloneDX --version 6.2.0
      - name: Build, test and pack
        run: dotnet run --project build/Build.csproj -- --target All --verbosity Diagnostic
      - name: Run runner tests (Cake 6.0.0)
        run: dotnet run --project build/Build.csproj -- --target RunnerTests --cake-version "6.0.0" --verbosity Diagnostic
      - name: Run runner tests (Cake 6.*)
        run: dotnet run --project build/Build.csproj -- --target RunnerTests --cake-version "6.*" --verbosity Diagnostic
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*.nupkg
          if-no-files-found: error

  # Only this job can publish: it runs no tests or third-party build steps, just the Release target on the built package.
  publish:
    needs: build
    runs-on: windows-latest
    environment: Production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Release
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project build/Build.csproj -- --target Release
